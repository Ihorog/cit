# 7 Архетипів Казкара
# Універсальні паттерни, що повторюються в різних контекстах

arkhetypy:
  - id: porih
    nazva: Поріг
    symvol: 🚪
    sutnist: Початок, перехід, межа між станами
    tryghery:
      - початок
      - перехід
      - зміна
      - відкриття
      - вхід
      - межа

  - id: tvorennya
    nazva: Творення
    symvol: ✨
    sutnist: Народження нового, прояв потенціалу
    tryghery:
      - створення
      - народження
      - прояв
      - розкриття
      - виникнення
      - творчість

  - id: refleksiya
    nazva: Рефлексія
    symvol: 🪞
    sutnist: Осмислення, усвідомлення, бачення глибини
    tryghery:
      - розуміння
      - усвідомлення
      - пауза
      - спостереження
      - осмислення
      - глибина

  - id: tsykl
    nazva: Цикл
    symvol: 🔄
    sutnist: Повторення з трансформацією, ритм
    tryghery:
      - повторення
      - ритм
      - повернення
      - спіраль
      - циклічність
      - сезон

  - id: zv_yazok
    nazva: Зв'язок
    symvol: 🔗
    sutnist: Об'єднання, зв'язність, відносини
    tryghery:
      - з'єднання
      - відносини
      - спільність
      - гармонія
      - партнерство
      - єдність

  - id: mandrivka
    nazva: Мандрівка
    symvol: 🧭
    sutnist: Шлях, дослідження, пошук
    tryghery:
      - дорога
      - пошук
      - рух
      - дослідження
      - подорож
      - шлях

  - id: peretvorennya
    nazva: Перетворення
    symvol: 🦋
    sutnist: Трансформація, метаморфоза, якісна зміна
    tryghery:
      - зміна
      - трансформація
      - метаморфоза
      - перехід
      - еволюція
      - переродження
