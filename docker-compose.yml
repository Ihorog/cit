version: '3.8'

services:
  # CIT API Server (Python)
  cit-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cimeika-api
    ports:
      - "8790:8790"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_TOKEN=${HF_TOKEN:-}
      - PORT=8790
    volumes:
      - ./server:/app/server
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8790/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cimeika-network

  # Web UI (Next.js)
  cit-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cimeika-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CIT_API_URL=http://cit-api:8790/chat
      - NODE_ENV=production
    depends_on:
      cit-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cimeika-network

networks:
  cimeika-network:
    driver: bridge

volumes:
  logs:
    driver: local
