name: Cimeika Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'cimeika/**'
      - 'server/**'
      - 'docker-compose.yml'
      - 'Dockerfile.*'
      - 'requirements.txt'
      - 'nginx.conf'
  pull_request:
    branches:
      - main
    paths:
      - 'cimeika/**'
      - 'server/**'
      - 'docker-compose.yml'
      - 'Dockerfile.*'
      - 'requirements.txt'
      - 'nginx.conf'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax checks
        run: |
          python -m py_compile server/cit_server.py
          python -m py_compile server/cit_ui_pwa.py
          python -m py_compile ui_dashboard/ui_server.py

      - name: Test server module import
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'server')
          import cit_server
          print('✅ Server module imported successfully')
          "

      - name: Test server startup
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_TOKEN }}
          CIT_PORT: 8792
        run: |
          # Start server in background
          timeout 10 python server/cit_server.py &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          
          # Wait for server to start
          sleep 5
          
          # Run health check
          curl -f http://127.0.0.1:8792/health && echo "✅ Health check passed" || echo "⚠️ Health check failed (server may not be fully started)"
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/cimeika-api:latest

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/cimeika
            git pull origin main
            docker-compose down
            docker-compose pull
            docker-compose up -d
            docker-compose logs -f --tail=50

  health-check:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f -s ${{ secrets.CIMEIKA_API_URL }}/health > /dev/null; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Waiting for health check... ($i/10)"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

  notify:
    needs: [test, build-and-deploy, health-check]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 Cimeika Deployment ${{ needs.build-and-deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            ${{ needs.health-check.result == 'success' && '🟢 System healthy' || '🔴 Health check failed' }}

            View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
