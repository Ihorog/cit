name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile.api'
      - 'api/**'
      - 'requirements.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Dockerfile.api'
      - 'api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile.api --tag cit-api:$(date +%s)
