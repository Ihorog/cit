<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0B2340" />
  <title>CIT • Cimeika</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id=\"chatBar\" style=\"position:fixed;left:12px;right:12px;bottom:12px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;\">
  <div id=\"chatLeft\" style=\"display:flex;gap:10px;align-items:center;\">
    <span class=\"pill small mono\">API: <span id=\"apiLabel\"></span></span>
    <button class=\"btn\" id=\"btnAttachImg\">🖼</button>
    <button class=\"btn\" id=\"btnAttachFile\">📎</button>
    <button class=\"btn\" id=\"btnFiles\">Файли</button>
  </div>
  <div id=\"chatRight\" style=\"display:flex;gap:10px;align-items:center;\">
    <button class=\"btn\" id=\"btnSelfCheck\">Self-check</button>
    <button class=\"btn primary\" id=\"btnSettings\">Налаштування</button>
  </div>
  <input id=\"imgInput\" type=\"file\" accept=\"image/*\" style=\"display:none\" />
  <input id=\"fileInput\" type=\"file\" style=\"display:none\" />
</div>

  <div id="app"></div>
  <script defer src="./app.js"></script>
<div id="toast"></div>

<div class="modal" id="modalFiles">
  <div class="modalCard">
    <div class="modalHead">
      <div class="modalTitle">Файли сховища</div>
      <button class="btn" data-close-modal="#modalFiles">Закрити</button>
    </div>
    <div class="small mono" id="filesStatus"></div>
    <hr/>
    <div id="filesList"></div>
  </div>
</div>

<div class="modal" id="modalSettings">
  <div class="modalCard">
    <div class="modalHead">
      <div class="modalTitle">Технічне меню (ключі/служби/сховище)</div>
      <button class="btn" data-close-modal="#modalSettings">Закрити</button>
    </div>

    <div class="grid2">
      <div class="field">
        <label class="small">OpenAI API Key (поточний стан)</label>
        <input id="cfg_openai" placeholder="(masked)" disabled />
      </div>
      <div class="field">
        <label class="small">OpenAI API Key (оновити)</label>
        <input id="cfg_openai_new" placeholder="sk-..." />
      </div>

      <div class="field">
        <label class="small">Модель</label>
        <input id="cfg_model" placeholder="gpt-4.1-mini" />
      </div>

      <div class="field">
        <label class="small">Storage mode</label>
        <select id="cfg_storage">
          <option value="local">local</option>
          <option value="webdav">webdav</option>
        </select>
      </div>

      <div class="field">
        <label class="small">Vault dir (local)</label>
        <input id="cfg_vault" placeholder="/storage/emulated/0/CimeikaVault" />
      </div>

      <div class="field">
        <label class="small">WebDAV URL (Keenetic)</label>
        <input id="cfg_webdav_url" placeholder="http://router:8080/webdav/CimeikaVault" />
      </div>

      <div class="field">
        <label class="small">WebDAV user</label>
        <input id="cfg_webdav_user" placeholder="user" />
      </div>

      <div class="field">
        <label class="small">WebDAV pass (оновити)</label>
        <input id="cfg_webdav_pass" placeholder="password" />
      </div>
    </div>

    <hr/>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" id="btnSaveCfg">Зберегти</button>
      <span class="small mono">Self-check output:</span>
    </div>
    <pre id="selfcheckOut" class="mono small" style="white-space:pre-wrap;margin-top:10px;background:rgba(255,255,255,0.05);border:1px solid var(--stroke);padding:10px;border-radius:16px;"></pre>
  </div>
</div>
</body>

</html>
