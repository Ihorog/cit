<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Легенда Сі</title>
    <link rel="stylesheet" href="styli/legenda.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-link">← Назад до Казкара</a>
            <h1 class="title">✨ Легенда Сі</h1>
            <p class="subtitle">Інтерактивне поле знання</p>
        </header>

        <main class="main-content">
            <!-- Поточний вузол -->
            <div class="current-node-section">
                <div class="node-card" id="current-node">
                    <div class="node-depth">Глибина: <span id="node-depth">0</span></div>
                    <h2 class="node-title" id="node-title">Присутність</h2>
                    <p class="node-description" id="node-description">
                        Завантаження...
                    </p>
                    <div class="node-archetype" id="node-archetype">
                        Архетип: <span id="archetype-name">—</span>
                    </div>
                </div>
            </div>

            <!-- Візуалізація графа -->
            <div class="graph-section card">
                <h3>Граф Сенсів</h3>
                <div class="graph-container" id="graph-container">
                    <svg id="graph-svg" width="100%" height="400"></svg>
                </div>
            </div>

            <!-- Резонуючі сенси -->
            <div class="resonance-section card">
                <h3>Резонуючі Сенси</h3>
                <div class="resonance-tags" id="resonance-tags">
                    <!-- Теги будуть тут -->
                </div>
            </div>

            <!-- Доступні шляхи -->
            <div class="paths-section card">
                <h3>Доступні Шляхи</h3>
                <div class="paths-grid" id="paths-grid">
                    <!-- Шляхи будуть тут -->
                </div>
            </div>

            <!-- Пошук -->
            <div class="search-section card">
                <h3>Семантичний Пошук</h3>
                <div class="search-input-group">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Пошук по сенсу..."
                    >
                    <button id="btn-search" class="btn-search">🔍</button>
                </div>
                <div class="search-results" id="search-results"></div>
            </div>

            <!-- Історія навігації -->
            <div class="history-section card">
                <h3>Історія Навігації</h3>
                <div class="history-breadcrumbs" id="history-breadcrumbs">
                    <!-- Шлях буде тут -->
                </div>
            </div>

            <!-- Редагування графа -->
            <div class="edit-section card">
                <h3>Редагування Графа</h3>
                
                <!-- Створення нового вузла -->
                <div class="edit-subsection">
                    <h4>Створити новий вузол</h4>
                    <form id="form-create-node" class="node-form">
                        <div class="form-group">
                            <label for="new-node-id">ID вузла:</label>
                            <input type="text" id="new-node-id" required placeholder="naprыklad: spoкiy_dushi">
                        </div>
                        <div class="form-group">
                            <label for="new-node-nazva">Назва:</label>
                            <input type="text" id="new-node-nazva" required placeholder="Наприклад: Спокій Душі">
                        </div>
                        <div class="form-group">
                            <label for="new-node-opys">Опис:</label>
                            <textarea id="new-node-opys" required rows="3" placeholder="Опис вузла..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="new-node-hlybyna">Глибина:</label>
                            <input type="number" id="new-node-hlybyna" required min="0" value="1">
                        </div>
                        <div class="form-group">
                            <label for="new-node-zvyazky">Зв'язані вузли (через кому):</label>
                            <input type="text" id="new-node-zvyazky" placeholder="prysutnist, tysha">
                        </div>
                        <div class="form-group">
                            <label for="new-node-sensy">Резонансні сенси (через кому):</label>
                            <input type="text" id="new-node-sensy" placeholder="спокій, гармонія, мир">
                        </div>
                        <div class="form-group">
                            <label for="new-node-arkhetyp">Архетип:</label>
                            <input type="text" id="new-node-arkhetyp" placeholder="Рефлексія">
                        </div>
                        <button type="submit" class="btn-create">Створити вузол</button>
                    </form>
                </div>

                <!-- Додавання зв'язку -->
                <div class="edit-subsection">
                    <h4>Додати зв'язок між вузлами</h4>
                    <form id="form-add-link" class="link-form">
                        <div class="form-group">
                            <label for="link-node-1">Перший вузол ID:</label>
                            <input type="text" id="link-node-1" required placeholder="prysutnist">
                        </div>
                        <div class="form-group">
                            <label for="link-node-2">Другий вузол ID:</label>
                            <input type="text" id="link-node-2" required placeholder="tysha">
                        </div>
                        <button type="submit" class="btn-link">Створити зв'язок</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="skripty/navihatsiya_legendy.js"></script>
</body>
</html>
