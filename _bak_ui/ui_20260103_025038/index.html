<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CIT — UIv2</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; }
    body { margin: 0; background: #0B0F14; color: #E8EEF6; height: 100vh; display: flex; flex-direction: column; }
    .top { padding: 12px 14px; border-bottom: 1px solid #1F2A36; font-weight: 800; display:flex; gap:10px; align-items:center; }
    .pill { font-size: 12px; padding: 4px 10px; border: 1px solid #2A3A4A; border-radius: 999px; background:#0F1620; color:#C9D6E6; }
    .wrap { flex: 1; display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 10px; overflow: hidden; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; overflow: hidden; }
    @media (min-width: 980px) {
      .grid { grid-template-columns: 420px 1fr; }
    }
    .card { border: 1px solid #1F2A36; border-radius: 16px; background: #0F1620; overflow: hidden; display:flex; flex-direction:column; min-height: 0; }
    .card h3 { margin: 0; padding: 12px 12px; border-bottom: 1px solid #1F2A36; font-size: 14px; letter-spacing: 0.2px; display:flex; justify-content:space-between; align-items:center;}
    .card .body { padding: 12px; display:flex; flex-direction:column; gap:10px; min-height:0; }
    .row { display:flex; gap:8px; align-items:center; }
    .row > * { flex: 0 0 auto; }
    .row .grow { flex: 1 1 0%; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #1F2A36;
      background: #0B0F14;
      color: #E8EEF6;
      outline: none;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid #2A3A4A;
      background: #16314B;
      color: #E8EEF6;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }
    button.secondary { background:#0B0F14; border-color:#2A3A4A; color:#C9D6E6; font-weight:700; }
    button.danger { background:#3A1C1C; border-color:#5A2B2B; }
    button:active { transform: translateY(1px); }
    .chatlog { flex: 1; overflow:auto; display:flex; flex-direction:column; gap:10px; padding-right: 4px; }
    .b { padding: 10px 12px; border: 1px solid #1F2A36; border-radius: 14px; max-width: 95%; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #12202F; }
    .bot { align-self: flex-start; background: #0B0F14; }
    .muted { color:#9FB2C7; font-size:12px; }
    .split { display:grid; grid-template-columns: 1fr; gap:10px; }
    @media (min-width: 980px) {
      .split { grid-template-columns: 1fr 1fr; }
    }
    .viewer {
      flex: 1;
      overflow:auto;
      padding: 12px;
      background:#0B0F14;
      border: 1px solid #1F2A36;
      border-radius: 12px;
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.4;
      min-height: 0;
    }
    .statusline { display:flex; gap:8px; flex-wrap:wrap; }
    .dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
    .ok { background:#2ECC71; }
    .no { background:#E74C3C; }
    .tiny { font-size: 12px; }
  </style>
</head>
<body>
  <div class="top">
    <div style="font-size:16px;">CIT — UIv2</div>
    <div class="pill" id="uiLink">UI: http://127.0.0.1:8010/</div>
    <div class="pill" id="apiLink">API: http://127.0.0.1:8790</div>
    <div class="pill statusline" id="apiStatus"><span class="dot no"></span><span class="tiny">health: unknown</span></div>
  </div>

  <div class="wrap">
    <div class="grid">

      <div class="card">
        <h3>Чат (POST /api/chat) <span class="muted" id="chatHint"></span></h3>
        <div class="body" style="min-height:0;">
          <div class="chatlog" id="chat"></div>
          <div class="row">
            <input class="grow" id="msg" placeholder="Напиши..." />
            <button id="send">➤</button>
          </div>
          <div class="row">
            <button class="secondary" id="pingChat">Ping chat</button>
            <button class="secondary" id="clearChat">Очистити чат</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Exec (POST /api/exec) <span class="muted" id="execHint"></span></h3>
        <div class="body" style="min-height:0;">
          <div class="split">
            <div>
              <div class="muted">Action</div>
              <select id="action">
                <option value="actions.registry.get">actions.registry.get</option>
                <option value="actions.node_packages.get">actions.node_packages.get</option>
              </select>
            </div>
            <div>
              <div class="muted">Шаблон</div>
              <select id="template">
                <option value="empty">input: {}</option>
                <option value="id_ci">input: { node_id: "ci" }</option>
              </select>
            </div>
          </div>

          <div>
            <div class="muted">Payload (JSON)</div>
            <textarea id="payload">{ "action": "actions.registry.get", "input": {} }</textarea>
          </div>

          <div class="row">
            <button id="runExec">Виконати</button>
            <button class="secondary" id="loadRegistry">GET /registry</button>
            <button class="secondary" id="loadNodes">GET /node-packages</button>
            <button class="secondary" id="copyOut">Копіювати output</button>
          </div>

          <div class="row">
            <button class="secondary" id="health">Перевірити health</button>
            <button class="danger" id="wipeOut">Очистити output</button>
          </div>

          <div class="muted">Output</div>
          <pre class="viewer" id="out">{}</pre>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
