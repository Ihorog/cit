<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f89ff" />
  <meta name="description" content="CIMEIKA - Українська персональна система" />
  <link rel="manifest" href="/manifest.json" />
  <title>🌀 CIMEIKA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0b0f14; color: #e8eef6; font-family: system-ui; }
    #root { width: 100%; height: 100%; }
    .loading { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; }
    .loading-spinner { width: 60px; height: 60px; border: 4px solid rgba(79,137,255,.2); border-top: 4px solid #4f89ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div style="font-size: 20px; margin-bottom: 10px;">🌀 CIMEIKA</div>
      <div style="font-size: 12px; opacity: 0.7;">Завантаження...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(console.error);
      });
    }
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  </script>
</body>
</html>
